name: Reusable CLA Assistant

on:
  workflow_call:

# Callers must grant the same permissions. A reusable workflow can reduce, but
# cannot elevate, the GITHUB_TOKEN permissions provided by its caller.
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

env:
  # GitHub Actions is removing the Node 20 runtime in fall 2026.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  cla:
    concurrency:
      # Keep events for one PR serialized without letting a burst of unrelated
      # PRs replace each other in GitHub's single pending concurrency slot.
      group: cla-signatures-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
      cancel-in-progress: false
    runs-on: blacksmith

    steps:
      - name: CLA Assistant
        # Supported continuation of the archived contributor-assistant/github-action.
        # Pinned to the immutable SHA for the v2.6.2 release.
        uses: ribtoks/cla-github-action@f22feedd1f3f46f23fab3bc100081d349f9108af # v2.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/ollygarden/.github/blob/main/CLA.md
          branch: cla-signatures
          allowlist: catalinasy,darbyhuye,ekidohahn,jpkrohling,lanaymc,leandrocaracciolo,niwoerner,perebaj,vesari,dependabot[bot],renovate[bot],github-actions[bot],coderabbitai[bot]
